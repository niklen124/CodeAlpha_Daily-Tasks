<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folio — Daily Planner</title>
<link rel="stylesheet" href="./style/style.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Mono:wght@300;400;500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">

<script src="./js/tailwindScript.js"></script>

</head>

<body class="desk-bg min-h-screen flex flex-col items-center justify-start py-10 px-4">
<div class="lamp-glow"></div>

<!-- Workspace label -->
<p class="font-mono text-[11px] tracking-[0.4em] uppercase mb-5 anim-slide-up" style="color:rgba(212,184,106,0.55);">
  ✦ &nbsp; FOLIO &nbsp; — &nbsp; Daily Planner &nbsp; ✦
</p>

<!-- ═══════ BOOK ═══════ -->
<div class="relative w-full book-shadow anim-slide-up anim-delay-1" style="max-width:640px;">

  <!-- Leather spine -->
  <div class="spine absolute left-0 top-0 bottom-0 z-20 rounded-l-xl" style="width:52px;">
    <div class="spine-sheen"></div>
    <div class="spine-label">
      <span class="font-serif text-[9px] tracking-[0.25em] uppercase" style="color:rgba(212,184,106,0.45); writing-mode:vertical-rl; transform:rotate(180deg);">Folio</span>
    </div>
  </div>

  <!-- Spiral coils — SVG rendered -->
  <div class="coils-wrap">
    <svg id="coils-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
  </div>

  <!-- Page stack depth -->
  <div class="page-stack"></div>

  <!-- ═══ PAPER ═══ -->
  <div class="paper rounded-r-xl" style="margin-left:52px;">
    <div class="paper-texture"></div>
    <div class="margin-line"></div>
    <div class="corner-fold"></div>
    <div class="corner-shadow"></div>

    <!-- Sticky note -->
    <div class="sticky absolute z-10 font-hand leading-snug px-2.5 pt-3 pb-5 rounded" style="top:18px;right:52px;width:84px;transform:rotate(2.5deg);color:#4a3800;font-size:12px;">
      <div class="absolute top-0 left-0 right-0 rounded-t" style="height:4px;background:rgba(0,0,0,0.10);"></div>
      📌 Stay sharp &amp; ship!
    </div>

    <!-- ── HEADER ── -->
    <header class="notebook-header relative z-[3]">
      <div class="flex justify-between items-start gap-3">
        <div class="flex-1">
          <p id="date-label" class="font-mono text-[10px] tracking-[0.28em] uppercase mb-1" style="color:#9c7e62;"></p>
          <h1 class="font-serif italic font-bold leading-none" style="font-size:2.8rem; color:#1a120a;">
            Daily <span class="wavy not-italic" style="color:#9b2335;">Tasks</span>
          </h1>
          <p class="font-mono mt-1.5 tracking-wider" style="font-size:9px; color:#9c7e62; letter-spacing:0.22em;">
            WRITE IT DOWN · GET IT DONE
          </p>
        </div>

        <!-- Progress ring + pct -->
        <div class="flex flex-col items-center gap-1.5 flex-shrink-0">
          <div class="relative" style="width:58px;height:58px;">
            <svg width="58" height="58" viewBox="0 0 58 58" style="transform:rotate(-90deg);">
              <circle cx="29" cy="29" r="24" fill="none" stroke="#e6d09a" stroke-width="4.5"/>
              <circle id="prog-arc" cx="29" cy="29" r="24" fill="none"
                stroke="#2d5a3d" stroke-width="4.5" stroke-linecap="round"
                stroke-dasharray="150.8" stroke-dashoffset="150.8"/>
            </svg>
            <div id="ring-pct" class="absolute inset-0 flex items-center justify-center font-mono font-bold" style="font-size:12px;color:#2d5a3d;">0%</div>
          </div>
          <span id="ring-label" class="font-mono text-[9px] tracking-wide uppercase" style="color:#9c7e62;">Progress</span>
        </div>
      </div>

      <!-- ── STAT PILLS ── -->
      <div class="flex flex-wrap gap-1.5 mt-3">
        <div class="flex items-center gap-1 rounded-full px-2.5 py-1" style="background:#f2e4c0;border:1px solid #e6d09a;">
          <svg class="w-3 h-3 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20" style="color:#6b5240;">
            <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/>
            <path fill-rule="evenodd" d="M4 5a2 2 0 012-2v1a1 1 0 102 0V3h4v1a1 1 0 102 0V3a2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/>
          </svg>
          <strong id="s-total" class="font-hand" style="font-size:1.05rem;color:#1a120a;line-height:1;">0</strong>
          <span class="font-mono" style="font-size:9px;color:#6b5240;">total</span>
        </div>
        <div class="flex items-center gap-1 rounded-full px-2.5 py-1" style="background:#f2e4c0;border:1px solid #e6d09a;">
          <svg class="w-3 h-3 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20" style="color:#2d5a3d;">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
          </svg>
          <strong id="s-done" class="font-hand" style="font-size:1.05rem;color:#2d5a3d;line-height:1;">0</strong>
          <span class="font-mono" style="font-size:9px;color:#6b5240;">done</span>
        </div>
        <div class="flex items-center gap-1 rounded-full px-2.5 py-1" style="background:#f2e4c0;border:1px solid #e6d09a;">
          <svg class="w-3 h-3 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20" style="color:#9b2335;">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/>
          </svg>
          <strong id="s-left" class="font-hand" style="font-size:1.05rem;color:#9b2335;line-height:1;">0</strong>
          <span class="font-mono" style="font-size:9px;color:#6b5240;">left</span>
        </div>
        <div class="flex items-center gap-1 rounded-full px-2.5 py-1" style="background:#f2e4c0;border:1px solid #e6d09a;">
          <svg class="w-3 h-3 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20" style="color:#b8720a;">
            <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          <strong id="s-high" class="font-hand" style="font-size:1.05rem;color:#b8720a;line-height:1;">0</strong>
          <span class="font-mono" style="font-size:9px;color:#6b5240;">urgent</span>
        </div>
      </div>
    </header>

    <!-- ── SEARCH + ACTIONS BAR ── -->
    <div class="relative z-[3] flex items-center gap-2 py-2 border-b" style="padding-left:68px; padding-right:16px; border-color:#e6d09a; background:rgba(242,228,192,0.3);">
      <!-- Search icon -->
      <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="#9c7e62" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input id="search-input" type="text" placeholder="Search tasks…"
        class="flex-1 bg-transparent border-none font-mono text-xs py-1"
        style="color:#1a120a; min-width:0; outline:none;">

      <!-- Divider -->
      <div style="width:1px;height:14px;background:#d8c8a0;flex-shrink:0;"></div>

      <!-- Sort button -->
      <button id="sort-btn" class="act-btn flex-shrink-0" data-tip="Cycle sort" onclick="cycleSort()">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="#9c7e62" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 4h13M3 8h9m-9 4h9m5-4v12m0 0l-4-4m4 4l4-4"/>
        </svg>
      </button>

      <!-- Toggle done visibility -->
      <button class="act-btn flex-shrink-0" data-tip="Hide completed" onclick="toggleDone()">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="#9c7e62" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 4h18M7 8h10M10 12h4"/>
        </svg>
      </button>
    </div>

    <!-- ── ADD TASK BAR ── -->
    <div class="relative z-[3] border-b" style="border-color:#e6d09a;">
      <!-- Pencil icon pinned in left margin area -->
      <svg class="absolute w-3.5 h-3.5" style="left:22px; top:16px; transform:rotate(-14deg); opacity:0.6;" fill="none" viewBox="0 0 24 24" stroke="#9b2335" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
      </svg>

      <!-- Main input row -->
      <div class="flex items-center gap-2 pt-2.5 pb-1.5" style="padding-left:68px; padding-right:14px;">
        <input id="task-input" type="text" maxlength="140" autocomplete="off"
          placeholder="Add a new task…"
          class="flex-1 bg-transparent border-none font-hand text-[1.4rem] py-0.5"
          style="color:#1a120a; caret-color:#9b2335; min-width:0; outline:none;">
        <!-- Add button -->
        <button id="add-btn" data-tip="Add task (Enter)"
          class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 transition-all duration-200"
          style="background:#1a120a; color:#faf3e0; box-shadow:0 3px 10px rgba(0,0,0,0.28); margin-right:12px;">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
          </svg>
        </button>
      </div>

      <!-- Meta row: priority + due + tag + note -->
      <div class="flex items-center gap-2 pb-2.5" style="padding-left:68px; padding-right:14px; flex-wrap:wrap;">
        <select id="priority-select" class="priority-select" style="font-size:10px; padding:2px 7px;">
          <option value="med">● Normal</option>
          <option value="high">▲ Urgent</option>
          <option value="low">▼ Low</option>
        </select>
        <input id="due-input" type="date" class="priority-select" style="font-size:10px; padding:2px 6px; cursor:pointer; max-width:130px;">
        <svg class="w-3 h-3 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="#c4a882" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-5 5a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 10V5a2 2 0 012-2z"/>
        </svg>
        <input id="tag-input" type="text" placeholder="Tag" maxlength="20"
          class="bg-transparent border-none font-mono text-[10px] outline-none" style="color:#6b5240; caret-color:#b8720a; width:64px;">
        <span style="color:#d8c8a0; font-size:10px;">|</span>
        <input id="note-input" type="text" placeholder="Note…" maxlength="80"
          class="bg-transparent border-none font-mono text-[10px] flex-1 outline-none" style="color:#6b5240; caret-color:#b8720a; min-width:0;">
      </div>
    </div>

    <!-- ── FILTER TABS ── -->
    <div class="relative z-[3] flex items-center gap-0.5 pt-2" style="padding-left:68px; padding-right:14px; border-bottom:1px solid #e6d09a;">
      <button class="tab-btn active" data-f="all">All</button>
      <button class="tab-btn" data-f="active">Active</button>
      <button class="tab-btn" data-f="done">Done</button>
      <button class="tab-btn" data-f="high">Urgent</button>
      <div class="flex-1"></div>
      <button id="clear-btn" class="font-mono text-[10px] tracking-wide underline decoration-dotted underline-offset-2 transition-colors pb-2" style="color:#9c7e62;">
        Clear done
      </button>
    </div>

    <!-- ── TASK LIST ── -->
    <div class="task-scroll overflow-y-auto relative z-[3]" style="max-height:340px;">
      <ul id="task-list" class="list-none pb-2 pt-1" style="padding-left:68px; padding-right:14px;"></ul>
    </div>

    <!-- ── FOOTER ── -->
    <div class="relative z-[3] flex justify-between items-center py-2 border-t" style="padding-left:68px; padding-right:14px; border-color:#e6d09a;">
      <span id="footer-msg" class="font-mono text-[10px]" style="color:#9c7e62;"></span>
      <div class="flex items-center gap-3">
        <button onclick="exportTasks()" class="font-mono text-[10px] underline decoration-dotted underline-offset-2 footer-action" style="color:#9c7e62;">Export</button>
        <button onclick="importTasks()" class="font-mono text-[10px] underline decoration-dotted underline-offset-2 footer-action" style="color:#9c7e62;">Import</button>
      </div>
    </div>

    <!-- ── BOTTOM DECO ── -->
    <div class="relative z-[3]" style="background:var(--paper2); background-image:none; padding: 8px 68px 10px 68px; border-top:1px solid var(--paper3);">

      <!-- Progress bar -->
      <div class="flex items-center gap-3 mb-2">
        <div style="flex:1; height:3px; border-radius:99px; background:var(--paper3); overflow:hidden;">
          <div id="prog-bar-fill" style="height:100%; border-radius:99px; width:0%; background:linear-gradient(to right,#2d5a3d,#4a9970); box-shadow:0 0 6px rgba(45,90,61,0.4); transition:width 0.7s cubic-bezier(0.4,0,0.2,1);"></div>
        </div>
        <span id="prog-bar-label" class="font-mono" style="font-size:9px; color:#9c7e62; flex-shrink:0; letter-spacing:0.12em;">0 / 0 done</span>
      </div>

      <!-- Faux ruled lines -->
      <div style="display:flex; flex-direction:column; gap:6px; opacity:0.3; margin-bottom:8px;">
        <div style="height:1px; background:linear-gradient(to right, transparent, #c8b090 12%, #c8b090 88%, transparent);"></div>
        <div style="height:1px; background:linear-gradient(to right, transparent, #c8b090 12%, #c8b090 88%, transparent);"></div>
        <div style="height:1px; background:linear-gradient(to right, transparent, #c8b090 12%, #c8b090 72%, transparent); width:75%;"></div>
      </div>

      <!-- Doodles row -->
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <svg width="18" height="18" viewBox="0 0 22 22" fill="none" style="opacity:0.18; flex-shrink:0;">
          <path d="M11 2 L12.8 8.2 L19.3 8.2 L14 12 L15.8 18.2 L11 14.5 L6.2 18.2 L8 12 L2.7 8.2 L9.2 8.2 Z" stroke="#6b5240" stroke-width="1.2" fill="rgba(107,82,64,0.12)" stroke-linejoin="round"/>
        </svg>
        <div style="flex:1; text-align:center;">
          <span class="font-hand" style="font-size:12px; color:rgba(107,82,64,0.38); letter-spacing:0.05em;">— focus &amp; be present —</span>
          <div style="display:flex; justify-content:center; gap:5px; margin-top:3px;">
            <div style="width:3px;height:3px;border-radius:50%;background:#c4a882;opacity:0.45;"></div>
            <div style="width:3px;height:3px;border-radius:50%;background:#c4a882;opacity:0.3;"></div>
            <div style="width:3px;height:3px;border-radius:50%;background:#c4a882;opacity:0.2;"></div>
          </div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="opacity:0.18; flex-shrink:0; transform:rotate(18deg);">
          <path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z" stroke="#6b5240" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M15 5l4 4" stroke="#6b5240" stroke-width="1" opacity="0.55"/>
        </svg>
      </div>
    </div>

    <!-- Scalloped bottom edge -->
    <div style="position:relative; z-index:3; height:13px; overflow:hidden;">
      <div style="position:absolute; top:0; left:0; right:0; height:13px;
        background: radial-gradient(circle at 9px 0, var(--paper2) 8px, transparent 8px) -9px 0 / 18px 13px repeat-x;">
      </div>
    </div>

  </div><!-- /paper -->

</div><!-- /book -->

<!-- Bottom label -->
<p class="mt-6 font-mono text-[10px] tracking-[0.45em] uppercase" style="color:rgba(212,184,106,0.3);">
  ✦ &nbsp; Folio · Daily Planner &nbsp; ✦
</p>

<!-- ── TOAST ── -->
<div id="toast" class="toast"></div>

<!-- ── MODAL (edit / detail) ── -->
<div id="modal" class="modal-overlay">
  <div class="modal-box">
    <h3 class="font-serif italic text-2xl mb-4" style="color:#1a120a;">Edit Task</h3>
    <div class="flex flex-col gap-3">
      <input id="modal-text" type="text" maxlength="140" class="w-full border rounded-lg px-3 py-2 font-hand text-xl outline-none" style="border-color:#e6d09a;color:#1a120a;background:#faf3e0;" placeholder="Task text…">
      <div class="flex gap-2">
        <select id="modal-priority" class="priority-select flex-1">
          <option value="med">● Normal</option>
          <option value="high">▲ Urgent</option>
          <option value="low">▼ Low</option>
        </select>
        <input id="modal-due" type="date" class="priority-select flex-1" style="cursor:pointer;">
      </div>
      <input id="modal-tag" type="text" maxlength="20" class="border rounded-lg px-3 py-1.5 font-mono text-xs outline-none" style="border-color:#e6d09a;color:#6b5240;background:#faf3e0;" placeholder="Tag (optional)">
      <input id="modal-note" type="text" maxlength="80" class="border rounded-lg px-3 py-1.5 font-mono text-xs outline-none" style="border-color:#e6d09a;color:#6b5240;background:#faf3e0;" placeholder="Note (optional)">
    </div>
    <div class="flex gap-2 mt-5 justify-end">
      <button onclick="closeModal()" class="font-mono text-xs px-4 py-2 rounded-lg border transition-colors" style="border-color:#e6d09a;color:#6b5240;">Cancel</button>
      <button onclick="saveModal()" class="font-mono text-xs px-5 py-2 rounded-lg transition-all" style="background:#1a120a;color:#faf3e0;">Save</button>
    </div>
  </div>
</div>

<!-- ════════════════ JAVASCRIPT ════════════════ -->
<script src="./js/todoListScript.js"></script>
</html>
